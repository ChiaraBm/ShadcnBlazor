name: "Nuget: publish"

on:
  workflow_dispatch:
  push:
    paths:
      - "ShadcnBlazor/**.csproj"
      - "ShadcnBlazor.Extras/**.csproj"
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    
    # Enable OIDC for package publishing
    permissions:
      id-token: write
      contents: read
    
    steps:
      ## Setup environment:
      
      # Fetch the code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Install dotnet 9
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0
      
      # Install nodejs/npm
      - name: Install NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Login into NuGet
      - name: NuGet Login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USERNAME }}
      
      ## Build:
      
      # CodeMirror
      - run: npm i
        working-directory: ShadcnBlazor.Extras/CodeMirror

      - run: npm run build
        working-directory: ShadcnBlazor.Extras/CodeMirror
        
      # Class list
      - run: npm i
        working-directory: ShadcnBlazor.Test/Styles
        
      - run: npm run build
        working-directory: ShadcnBlazor.Test/Styles
      
      ## Publish:
      
      # ShadcnBlazor
      - name: Publish ShadcnBlazor
        uses: alirezanet/publish-nuget@v3.1.0
        with:
          PROJECT_FILE_PATH: ShadcnBlazor/ShadcnBlazor.csproj
          TAG_COMMIT: false
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      
      # ShadcnBlazor.Extras
      - name: Publish ShadcnBlazor.Extras
        uses: alirezanet/publish-nuget@v3.1.0
        with:
          PROJECT_FILE_PATH: ShadcnBlazor.Extras/ShadcnBlazor.Extras.csproj
          TAG_COMMIT: false
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}