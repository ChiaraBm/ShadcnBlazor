name: "NPM: publish"

on:
  workflow_dispatch:
  push:
    paths:
      - "ShadcnBlazor.Test/Styles/shadcnblazor/package.json"
    branches:
      - main

# OIDC for npm publishing
permissions:
  id-token: write
  contents: read

jobs:
  
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - run: npm i
        working-directory: ShadcnBlazor.Test/Styles

      - run: npm run tailwind-plugin
        working-directory: ShadcnBlazor.Test/Styles

      - uses: JS-DevTools/npm-publish@v4
        with:
          package: "ShadcnBlazor.Test/Styles/shadcnblazor"